<header class="site-header {% if page.title == 'Home' %}home-header{% endif %}" role="banner">
  <div class="heading">
    <h1 class="site-title">
      <a rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    </h1>
    <h2 class="site-description">{{ site.description | escape }}</h2>
  </div>

  <nav class="site-nav">
    <input type="checkbox" id="nav-trigger" class="nav-trigger" />
    <label for="nav-trigger" class="menu-icon"> {% include icon-menu.svg %} </label>

    <ul class="nav-links">
      {%- for title in site.nav_pages -%} {%- assign my_page = site.pages | where: "title", title |
      first -%} {%- if my_page.title -%}
      <li>
        <a class="page-link" href="{{ my_page.url | relative_url }}"
          >{{ my_page.title | escape }}</a
        >
      </li>
      {%- endif -%} {%- endfor -%}
    </ul>
  </nav>
</header>
